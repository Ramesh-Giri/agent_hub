name: AgentHub
options:
  bundleIdPrefix: com.techkreator
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  AgentHub:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techkreator.AgentHub
        PRODUCT_NAME: AgentHub
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: AgentHub.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: AgentHub.entitlements
      properties:
        com.apple.security.app-sandbox: false
